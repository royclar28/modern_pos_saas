services:
  laravel:
    build:
      context: ./apps/api-laravel
      dockerfile: Dockerfile
    container_name: merx_pos_backend
    ports:
      - "8001:8001"
    volumes:
      - ./apps/api-laravel:/app
    restart: unless-stopped
    # El entrypoint.sh del Dockerfile arranca FrankenPHP via Octane
    # No se necesita override de command
