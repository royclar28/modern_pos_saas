name: CI — Validate

on:
  pull_request:
    branches: [main, qa]
  push:
    branches-ignore: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend ─────────────────────────────────
      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/api-laravel/vendor
          key: composer-ci-${{ hashFiles('apps/api-laravel/composer.lock') }}
          restore-keys: composer-ci-

      - name: Composer validate
        working-directory: apps/api-laravel
        run: composer validate --strict

      - name: Composer install
        working-directory: apps/api-laravel
        run: composer install --no-interaction

      # ── Frontend ─────────────────────────────────
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-ci-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-ci-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: apps/web
        run: pnpm tsc --noEmit 2>&1 || echo "⚠️  tsc check skipped (puede requerir config)"

      - name: Build check
        working-directory: apps/web
        run: pnpm build
